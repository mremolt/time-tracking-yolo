spring:
  application.name: timetracking
  datasource:
    url: jdbc:h2:file:./data/timetracking;AUTO_SERVER=TRUE
    username: sa
    password: ""
  jpa:
    hibernate.ddl-auto: update
    open-in-view: false
    properties.hibernate.jdbc.time_zone: UTC
  jackson:
    default-property-inclusion: always
    serialization.write-dates-as-timestamps: false
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  servlet.multipart.max-file-size: 5MB
server:
  port: 8080
  servlet.session.timeout: 30m
  servlet.session.cookie.same-site: lax
  servlet.session.cookie.http-only: true
app:
  # Policies (step 0.1 – assumptions, see docs/06-assumptions.md)
  max-failed-logins: 5
  lockout-minutes: 15
  min-password-length: 10
  invite-valid-hours: 72
  reset-valid-hours: 2
  # Local installation: captured mails can be read at /mailbox without login. NEVER enable in production.
  mail-viewer-enabled: true
  bootstrap-admin-email: admin@example.com
  bootstrap-admin-password: ChangeMe-12345
  demo-data: false
  base-url: http://localhost:4200
